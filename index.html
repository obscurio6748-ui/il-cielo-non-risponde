<script>
const pages = [{"title":"Copertina","section":"Apertura","html":"<div class='cover-art'><div class='moon'></div><div class='orbit o1'></div><div class='orbit o2'></div><div class='constellation'>✧ · · ✦<br>· ✧ ·<br>✦ · · ✧</div><div class='cover-kicker'>Corso di Divinazione · Hogwarts</div><h1>IL CIELO<br><em>NON RISPONDE</em></h1><div class='cover-rule'></div><p>Le arti divinatorie, i loro limiti e il peso di ciò che vediamo</p><div class='author'>PROF. LYSANDER GOLDTRY</div><small>Edizione didattica · per gli studenti di Divinazione</small></div>","type":"cover","sub":""},{"title":"Colophon e avvertenza","section":"Apertura","html":"<div class=\"eyebrow\">Hogwarts · Edizione per gli studenti</div><h2>Colophon e avvertenza</h2><p>Il Cielo non risponde. <em>Le arti divinatorie, i loro limiti e il peso di ciò che vediamo.</em> Testo di studio a cura del professor <strong>Lysander Goldtry</strong>, per gli allievi della Scuola di Magia e Stregoneria di Hogwarts.</p><p>Questa copia contiene il percorso propedeutico del primo e del secondo anno e il corso specialistico dal terzo al settimo anno. I moduli preparatori non sostituiscono la normale scelta delle materie prevista a Hogwarts dal terzo anno: sono letture e laboratori introduttivi messi a disposizione dal docente.</p><p>Le parti destinate allo studio sono contrassegnate da obiettivi, procedure ed esercizi. Le annotazioni personali dell’autore, ove presenti, non costituiscono materia d’esame. Le pagine sigillate non sono necessarie per superare il corso.</p><div class=\"star-quote\">«Chi vi promette un futuro senza incertezze vi sta chiedendo di smettere di pensare.» — L. Goldtry</div>","type":"chapter","sub":""},{"title":"Come usare questo libro","section":"Apertura","html":"<div class=\"eyebrow\">Guida alla lettura</div><h2>Come usare questo libro</h2><p>Leggete l’argomento prima di eseguire la pratica. Conservate un quaderno diviso in quattro colonne: <strong>osservazione, interpretazione, alternative, verifica</strong>. Nelle prime due colonne non scrivete mai la stessa cosa.</p><p>Ogni tecnica qui descritta appartiene a una tradizione di studio del mondo magico: non tutte le interpretazioni producono una previsione e nessuna osservazione, da sola, autorizza a pronunciare una sentenza sulla vita altrui.</p><p>Nella versione digitale potete sfogliare con le frecce, aprire l’indice, modificare la dimensione del carattere e attivare una composizione sonora originale. Le pagine lunghe scorrono all’interno del foglio senza perdere testo.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Annotate la data, il luogo, lo strumento e le condizioni della prova.</li><li>Descrivete il segno senza attribuirgli un significato.</li><li>Proponete almeno due letture e indicate cosa potrebbe smentirle.</li><li>Scrivete una conclusione provvisoria, non una condanna.</li></ol><aside class=\"margin-note\">Nota dell’autore — Ho imparato troppo tardi che la paura sa imitare la certezza.</aside>","type":"chapter","sub":""},{"title":"Prefazione","section":"Apertura","html":"<div class=\"eyebrow\">Agli studenti</div><h2>Prefazione</h2><p>Esistono libri che insegnano a riconoscere un presagio e libri che insegnano a riconoscere i nostri desideri dentro un presagio. Questo prova a fare entrambe le cose. Un allievo può vedere con nitidezza e interpretare male; può non vedere nulla e fare un lavoro esemplare.</p><p>Vi insegnerò metodi, registri, cautele e una grammatica delle immagini. Non troverete qui un elenco di disgrazie inevitabili. La Divinazione non ha il diritto di spaventare chi vi ascolta, e chi la insegna ha il dovere di ricordarlo per primo.</p><p>Sono arrivato a queste pagine dopo molte notti passate a cercare risposte dove non ce n’erano. Se a volte la mia voce sembra allontanarsi dal tono di un manuale, perdonatemi. Scrivo per insegnare; ma scrivere significa, qualche volta, lasciar passare ciò che si era tenuto chiuso.</p><div class=\"star-quote\">«Una visione non è un ordine. Una possibilità non è una sentenza.»</div><p class=\"muted\">Lysander Goldtry · Torre di Divinazione, Hogwarts</p>","type":"chapter","sub":""},{"title":"Indice generale","section":"Apertura","html":"<div class=\"eyebrow\">Consultazione rapida</div><h2>Indice generale</h2><p class=\"lead\">Sette anni di osservazione. Un atlante. Alcune notti che non appartengono al programma.</p><div id=\"toc-list\" class=\"toc-list\"></div><p class=\"muted\">L’indice mostra le sezioni e permette di aprire direttamente qualunque pagina.</p>","type":"index","sub":""},{"title":"Le sette regole della lettura","section":"Fondamenti","html":"<div class=\"eyebrow\">Protocollo di aula</div><h2>Le sette regole della lettura</h2><p>Le pratiche divinatorie non danno il permesso di invadere la vita privata degli altri. Il compito del lettore è formulare un’ipotesi responsabile, non imporla.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Scrivere il segno prima del suo significato.</li><li>Non cancellare mai un errore dal registro.</li><li>Distinguere la previsione spontanea dall’interpretazione costruita.</li><li>Non interrogare i ricordi di un compagno senza consenso.</li><li>Non annunciare morte, malattia o sventura come certezze.</li><li>In caso di turbamento interrompere la seduta e chiedere assistenza.</li><li>Presentare sempre una via d’azione nel presente, se esiste.</li></ol><aside class=\"margin-note\">Sui miei vecchi quaderni la terza regola era stata raschiata via. Non lo farò mai più.</aside>","type":"chapter","sub":""},{"title":"Le tre fonti dell’errore","section":"Fondamenti","html":"<div class=\"eyebrow\">Osservazione · metodo · responsabilità</div><h2>Le tre fonti dell’errore</h2><p><strong>Il caso:</strong> un disegno può apparire significativo solo perché ne abbiamo cercato la somiglianza. <strong>Il desiderio:</strong> una risposta gradita può sembrarci più vera. <strong>Il timore:</strong> una lettura negativa può oscurare interpretazioni più ragionevoli.</p><p>La tradizione magica conosce autentici eventi profetici, ma non offre un metodo infallibile per riconoscerli mentre avvengono. Una visione spontanea non è la stessa cosa di una figura nelle foglie di tè.</p><table><thead><tr><th>Segno</th><th>Domanda corretta</th></tr></thead><tbody><tr><td>Una linea spezzata</td><td>Che cosa ho osservato esattamente?</td></tr><tr><td>Un sogno ricorrente</td><td>È cambiato con le mie emozioni?</td></tr><tr><td>Una carta inquietante</td><td>Quali altre letture sono possibili?</td></tr></tbody></table><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Descrivete un episodio ambiguo senza usare le parole destino, certo, inevitabile o profezia.</p></div>","type":"chapter","sub":""},{"title":"Primo anno · Imparare a stare","section":"Anno I","html":"<div class='eyebrow'>Anno I · Le fondamenta</div><h2>Imparare a stare</h2><p class='large'>Prima di imparare a vedere, l'allievo deve imparare a rimanere presente.</p><div class='lesson-list'><div><b>01 · Il pendolo</b><span>Movimento, domanda, silenzio mentale.</span></div><div><b>02 · La tazza</b><span>Tasseomanzia: forme, residui, associazioni.</span></div><div><b>03 · Il caso</b><span>Coincidenza, attenzione selettiva, presagio.</span></div><div><b>04 · La mano</b><span>Chiromanzia introduttiva e lettura non deterministica.</span></div></div><p>Nel primo anno non si chiede allo studente di vedere lontano. Gli si chiede di descrivere con precisione ciò che ha davanti e di non aggiungere paura dove c'è soltanto incertezza.</p><div class='margin-note'>Compito di Lysander: restare seduto finché il pendolo si ferma. Non interpretare ogni oscillazione come un avvertimento.</div>","type":"year","sub":""},{"title":"Lezione I · Il pendolo","section":"Anno I","html":"<div class='eyebrow'>Anno I · Lezione 01</div><h2>Il pendolo e il silenzio</h2><p>Il pendolo è uno strumento di concentrazione: il suo movimento può aiutare a rendere visibili le aspettative di chi lo osserva. In un contesto magico, il corso ne studia anche la risposta ai quesiti rituali; in ogni caso, una risposta non deve essere accettata senza esame.</p><h3>Metodo</h3><ol><li>Annota la domanda in una frase neutra.</li><li>Stabilisci prima come registrerai i movimenti.</li><li>Osserva senza cambiare la domanda a ogni oscillazione.</li><li>Ripeti in un altro momento e confronta gli esiti.</li></ol><h3>Errore da evitare</h3><p>Riformulare la domanda finché lo strumento sembra dire ciò che desideri o temi. L'ansia tende a trasformare ogni movimento in un verdetto.</p><div class='margin-note'>Nota mia: se la mano trema, non significa che il futuro stia bussando. A volte è soltanto una mano.</div>","type":"chapter","sub":""},{"title":"Lezione II · La tazza","section":"Anno I","html":"<div class='eyebrow'>Anno I · Lezione 02</div><h2>Tasseomanzia: ciò che resta</h2><p>Le foglie sul fondo di una tazza formano macchie, linee e spazi vuoti. La lettura comincia dalla descrizione: una curva, un gruppo, una figura simile a un ponte. Solo dopo si passa alle associazioni.</p><h3>Tre passaggi</h3><div class='lesson-list'><div><b>Descrivere</b><span>«Una linea scura sale lungo il bordo.»</span></div><div><b>Associare</b><span>«Potrebbe ricordare una strada, una radice o una crepa.»</span></div><div><b>Contestualizzare</b><span>«Quale significato ha per la persona che ha posto la domanda?»</span></div></div><p>Non esiste una forma che significhi la stessa cosa per ogni persona. Una tazza non conosce la biografia di chi la tiene: è l'incontro fra segno, domanda e interpretazione a costruire una lettura.</p>","type":"chapter","sub":""},{"title":"Lezione III · Il caso","section":"Anno I","html":"<div class='eyebrow'>Anno I · Lezione 03</div><h2>L'incontro casuale</h2><p>Una piuma sul davanzale, tre luci nella nebbia, una frase udita passando. La mente umana cerca connessioni perché le connessioni possono essere utili. Il divinatore deve imparare a distinguere una coincidenza memorabile da un segno a cui attribuisce significato.</p><p>Nel quaderno si registrano anche le occasioni in cui un presagio non si avvera, le immagini dimenticate e le interpretazioni cambiate dopo l'evento. Senza questi dati, la memoria seleziona ciò che sembra confermare la previsione.</p><div class='exercise'><b>Esercizio</b><p>Per sette giorni, annota un'immagine che ti colpisce e il suo significato iniziale. Non modificarlo retroattivamente. Alla fine della settimana, rileggi senza cercare di trasformare ogni evento in una prova.</p></div>","type":"chapter","sub":""},{"title":"Lezione IV · La mano","section":"Anno I","html":"<div class='eyebrow'>Anno I · Lezione 04</div><h2>Chiromanzia introduttiva</h2><p>La chiromanzia tradizionale interpreta linee e rilievi della mano come simboli di temperamento e percorso. In questo corso, la mano non è una gabbia del destino: è una mappa rituale che invita a parlare di scelte, abitudini e possibilità.</p><table><tr><th>Segno tradizionale</th><th>Domanda da porre</th></tr><tr><td>Linea lunga</td><td>Che cosa consideri continuità nella tua vita?</td></tr><tr><td>Interruzione</td><td>Quale cambiamento stai cercando di comprendere?</td></tr><tr><td>Incrocio</td><td>Quali decisioni sembrano competere fra loro?</td></tr></table><p>Una lettura etica non annuncia morte, malattia o rovina a partire da una linea. Non trasforma la vulnerabilità di qualcuno in una certezza.</p>","type":"chapter","sub":""},{"title":"Scheda di osservazione · I anno","section":"Anno I","html":"<div class=\"eyebrow\">Laboratorio · metodo comune</div><h2>Scheda di osservazione · I anno</h2><p>Alla fine di ogni lezione del primo anno compilate una scheda. Non serve aver «indovinato» qualcosa: un resoconto preciso vale più di una supposizione fortunata.</p><table><thead><tr><th>Campo</th><th>Che cosa annotare</th></tr></thead><tbody><tr><td>Strumento</td><td>Pendolo, tazza, incontro casuale, mano</td></tr><tr><td>Fatto osservato</td><td>Movimento, forma, distanza, linea</td></tr><tr><td>Prima lettura</td><td>Interpretazione iniziale</td></tr><tr><td>Lettura alternativa</td><td>Un’altra ipotesi possibile</td></tr><tr><td>Conclusione</td><td>Ciò che si può e non si può sostenere</td></tr></tbody></table><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Consegnate due schede della stessa tecnica, svolte in giorni diversi. Indicate che cosa cambia tra i due risultati.</p></div>","type":"chapter","sub":""},{"title":"Anno II · Le forme e le coincidenze","section":"Anno II","html":"<div class=\"eyebrow\">Anno II · Propedeutica avanzata</div><h2>Le forme e le coincidenze</h2><p class=\"large\">La materia è un supporto; l’interpretazione è una responsabilità.</p><h3>Obiettivo formativo</h3><p>Descrivere un segno riproducibile, confrontare letture indipendenti e rendere esplicito il margine d’incertezza.</p><div class=\"lesson-list\"><div><b>05 · Ceromanzia</b><span>Forma, consistenza e confronto fra osservatori</span></div><div><b>06 · Litomanzia</b><span>Scelta, disposizione e repertorio simbolico</span></div><div><b>07 · Auguria</b><span>L’osservazione del volo senza trasformare ogni incontro in presagio</span></div><div><b>08 · Registri incrociati</b><span>Riconoscere ripetizioni e smentite</span></div></div><aside class=\"margin-note\">La valutazione riguarda metodo, rigore e responsabilità. Nessun allievo è giudicato per l’assenza di un dono innato.</aside>","type":"year","sub":""},{"title":"Ceromanzia: il disegno della cera","section":"Anno II","html":"<div class=\"eyebrow\">Anno II · Lezione 05 · Dispensa autorizzata</div><h2>Ceromanzia: il disegno della cera</h2><p class=\"lead\">Non tutto ciò che prende forma possiede un significato.</p><p>La ceromanzia interpreta le figure prodotte dalla cera raffreddata nell’acqua. Le immagini cambiano con la temperatura, l’altezza di versamento e i moti del recipiente: ignorare queste variabili significa attribuire al destino ciò che dipende da un gesto.</p><p>In aula usiamo cera preparata dal docente e una vasca protetta da incanti termici. La sicurezza precede qualsiasi lettura.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Registrate la temperatura approssimativa dell’acqua e il tipo di cera.</li><li>Osservate la forma dall’alto, poi lateralmente: tracciatene il contorno.</li><li>Scrivete tre somiglianze possibili senza sceglierne subito una.</li><li>Confrontate il disegno con quello di un compagno che non conosca la domanda.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Spiegate in sei righe perché due lettori potrebbero vedere cose diverse nella stessa forma.</p></div><aside class=\"margin-note\">Mai versare cera bollente senza la supervisione del docente.</aside>","type":"chapter","sub":""},{"title":"Litomanzia e oggetti di peso","section":"Anno II","html":"<div class=\"eyebrow\">Anno II · Lezione 06 · Dispensa autorizzata</div><h2>Litomanzia e oggetti di peso</h2><p class=\"lead\">La scelta dello strumento influenza la lettura.</p><p>Nella litomanzia ogni pietra è associata a un repertorio di qualità: colore, durezza, origine, orientamento. Il simbolo non risiede necessariamente nella pietra; nasce dalla relazione fra la pietra scelta, la posizione e la domanda.</p><p>Prima della seduta fissate le associazioni in un glossario. Cambiarle dopo aver visto il risultato è un errore di metodo.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Scegliete cinque pietre riconoscibili e segnate il loro significato convenuto.</li><li>Disponetele su un panno senza osservare la collocazione iniziale.</li><li>Descrivete distanze, vicinanze e raggruppamenti.</li><li>Formulate un’interpretazione e una lettura alternativa.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Progettate un piccolo sistema di cinque pietre che un altro studente possa usare seguendo soltanto le vostre istruzioni.</p></div>","type":"chapter","sub":""},{"title":"Auguria: leggere il volo","section":"Anno II","html":"<div class=\"eyebrow\">Anno II · Lezione 07 · Dispensa autorizzata</div><h2>Auguria: leggere il volo</h2><p class=\"lead\">Un uccello non è un messaggero obbligato.</p><p>L’auguria osserva movimenti e apparizioni degli uccelli. Nelle tradizioni antiche contavano direzione, numero e comportamento; per noi conta anche il contesto: stagione, habitat, condizioni del vento.</p><p>Si osserva senza attirare, disturbare o trasformare l’animale in uno strumento. La cura del vivente viene prima della curiosità dell’interprete.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Registrate per dieci minuti il comportamento visibile di un uccello.</li><li>Separate movimenti osservati da immagini o associazioni evocate.</li><li>Annotate una spiegazione naturale del comportamento.</li><li>Indicate soltanto dopo una possibile lettura simbolica.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Scrivete perché «tre corvi» non costituiscono da soli una prova di sventura.</p></div>","type":"chapter","sub":""},{"title":"Confrontare i presagi","section":"Anno II","html":"<div class=\"eyebrow\">Anno II · Lezione 08 · Dispensa autorizzata</div><h2>Confrontare i presagi</h2><p class=\"lead\">Ripetere una prova non è cercare una conferma.</p><p>Un buon registro conserva anche le letture mancate. Se il lettore seleziona solo i presagi che sembrano avverarsi, il libro diventa una galleria dei propri ricordi preferiti.</p><p>Confrontate osservazioni dello stesso fenomeno a distanza di una settimana, senza riscrivere retroattivamente le conclusioni.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Numerate ogni tentativo.</li><li>Annotate la domanda e la previsione in modo verificabile.</li><li>Stabilite una data di controllo ragionevole.</li><li>Scrivete esito, dubbio o impossibilità di verifica senza cancellare l’originale.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Preparate un registro di quattro prove e un commento su ciò che non avete potuto sapere.</p></div>","type":"chapter","sub":""},{"title":"Anno III · I linguaggi della Divinazione","section":"Anno III","html":"<div class=\"eyebrow\">Anno III · Corso ordinario</div><h2>I linguaggi della Divinazione</h2><p class=\"large\">Dal terzo anno la Divinazione diventa un insegnamento specialistico.</p><h3>Obiettivo formativo</h3><p>Costruire un’interpretazione argomentata, collegando evidenze e convenzioni senza imporre pronostici ad altri.</p><div class=\"lesson-list\"><div><b>09 · Il lessico del simbolo</b><span>Descrizione, contesto, analogia</span></div><div><b>10 · Foglie di tè II</b><span>Letture argomentate e possibilità concorrenti</span></div><div><b>11 · Carte e disposizioni</b><span>Domanda, posizione e combinazione</span></div><div><b>12 · Rune: confronto culturale</b><span>Un sistema diverso, non una scorciatoia</span></div><div><b>13 · Etica della consultazione</b><span>Consenso, linguaggio e limiti</span></div></div><aside class=\"margin-note\">La valutazione riguarda metodo, rigore e responsabilità. Nessun allievo è giudicato per l’assenza di un dono innato.</aside>","type":"year","sub":""},{"title":"La grammatica dei simboli","section":"Anno III","html":"<div class=\"eyebrow\">Anno III · Lezione 09 · Dispensa autorizzata</div><h2>La grammatica dei simboli</h2><p class=\"lead\">Il simbolo è un vocabolario, non una sentenza.</p><p>Una scala può suggerire salita, fatica, distanza o accesso. Nessuna delle quattro letture è obbligata. La posizione del simbolo, la domanda e gli altri segni costituiscono la sua grammatica.</p><p>Il primo passaggio consiste nel nominare forma, dimensione e relazione con gli elementi vicini; il secondo nell’esplicitare la convenzione interpretativa adottata.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Disegnate la figura senza darle un titolo.</li><li>Scrivete tre significati plausibili e la tradizione da cui li ricavate.</li><li>Eliminate quelli incompatibili con il contesto.</li><li>Concludete in forma condizionale, non assoluta.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Esaminate «una chiave sotto l’acqua»: interpretatela in un contesto di studio e in uno di amicizia.</p></div>","type":"chapter","sub":""},{"title":"Tasseomanzia: una seconda lettura","section":"Anno III","html":"<div class=\"eyebrow\">Anno III · Lezione 10 · Dispensa autorizzata</div><h2>Tasseomanzia: una seconda lettura</h2><p class=\"lead\">In una tazza non basta riconoscere un animale.</p><p>Le foglie di tè producono trame, addensamenti e vuoti. La parte alta della tazza, il fondo, il manico e la direzione della rotazione hanno significati diversi secondo le convenzioni adottate. Prima di iniziare, dichiarate quali userete.</p><p>L’allievo non deve forzare la tazza a contenere la risposta sperata. Disegnare l’immagine prima di pronunciare una lettura aiuta a distinguerle.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Fissate la convenzione spaziale nel quaderno.</li><li>Tracciate i tre segni più evidenti; attribuite a ognuno due significati.</li><li>Componete una lettura coerente e una alternativa.</li><li>Spiegate quale dettaglio potrebbe favorire una delle due.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Redigete un consulto di dodici righe con conclusione prudente, senza menzionare morte o catastrofe.</p></div>","type":"chapter","sub":""},{"title":"Carte, arcani e disposizioni","section":"Anno III","html":"<div class=\"eyebrow\">Anno III · Lezione 11 · Dispensa autorizzata</div><h2>Carte, arcani e disposizioni</h2><p class=\"lead\">La posizione modifica il senso della carta.</p><p>La cartomanzia non è il semplice riconoscimento di immagini. Una disposizione a tre carte può distinguere situazione, ostacolo e risorsa: le parole sono categorie interpretative, non fotografie del futuro.</p><p>Il mazzo va documentato: simbologia, edizione, significati dichiarati prima di mescolare. Le carte non sostituiscono il giudizio di chi consulta.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Ponete una domanda aperta che non cerchi una condanna.</li><li>Mescolate, disponete tre carte e annotate ordine e orientamento.</li><li>Leggete prima ogni posizione, poi le relazioni fra i simboli.</li><li>Concludete con un’azione ragionevole nel presente.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Con le figure «Torre», «Stella» e «Porta», scrivete due interpretazioni opposte senza cambiare le carte.</p></div>","type":"chapter","sub":""},{"title":"Rune e sistemi di scrittura sacra","section":"Anno III","html":"<div class=\"eyebrow\">Anno III · Lezione 12 · Dispensa autorizzata</div><h2>Rune e sistemi di scrittura sacra</h2><p class=\"lead\">Un segno storico non è un ornamento intercambiabile.</p><p>I segni runici appartengono a tradizioni specifiche, studiate più estesamente in Antiche Rune. In Divinazione ne esaminiamo l’uso interpretativo soltanto dopo averne chiarito nome, contesto e limiti.</p><p>Attribuire a una runa qualunque significato ci piaccia impoverisce sia lo studio storico sia la lettura. Evitate di presentare una ricostruzione personale come regola antica indiscutibile.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Selezionate quattro segni da un repertorio fornito in aula.</li><li>Scrivete nome, valore tradizionale e adattamento divinatorio.</li><li>Formulate una domanda non invasiva.</li><li>Confrontate due letture basate sullo stesso ordine.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Distinguete in una tabella significato documentato, attribuzione simbolica e vostra ipotesi.</p></div>","type":"chapter","sub":""},{"title":"Il consulto responsabile","section":"Anno III","html":"<div class=\"eyebrow\">Anno III · Lezione 13 · Dispensa autorizzata</div><h2>Il consulto responsabile</h2><p class=\"lead\">Nessuno studente è il futuro di un altro.</p><p>Il consenso viene chiesto prima della lettura, e può essere ritirato in qualunque momento. Il consultante conserva il diritto di non rispondere a una domanda, contestare la lettura o interrompere la prova.</p><p>Non si attribuiscono colpe né si annunciano eventi irreparabili. La formula «questo potrebbe suggerire» è una forma di precisione, non di debolezza.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Chiedete il permesso e chiarite l’ambito della domanda.</li><li>Svolgete la lettura con annotazioni accessibili all’interessato.</li><li>Presentate almeno una spiegazione alternativa.</li><li>Concludete restituendo autonomia alla persona.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Riscrivete la frase «Perderai qualcuno» in tre modi responsabili, senza nascondere la vostra incertezza.</p></div><aside class=\"margin-note\">Se un consulto provoca angoscia, sospendete. Il professore è un adulto di riferimento, non un giudice dei presagi.</aside>","type":"chapter","sub":""},{"title":"Anno IV · Visioni e superfici","section":"Anno IV","html":"<div class=\"eyebrow\">Anno IV · Percezione e introspezione</div><h2>Visioni e superfici</h2><p class=\"large\">Non tutto ciò che appare arriva da fuori.</p><h3>Obiettivo formativo</h3><p>Descrivere esperienze interiori con rigore, senza confondere immaginazione, memoria, suggestione e profezia.</p><div class=\"lesson-list\"><div><b>14 · Sfera di cristallo</b><span>Attenzione, riflesso e immagine involontaria</span></div><div><b>15 · Specchio scuro</b><span>Condizioni di lettura e suggestione</span></div><div><b>16 · Oniromanzia</b><span>Diario dei sogni e simboli personali</span></div><div><b>17 · Visione e ricordo</b><span>Riconoscere dove termina l’osservazione</span></div></div><aside class=\"margin-note\">La valutazione riguarda metodo, rigore e responsabilità. Nessun allievo è giudicato per l’assenza di un dono innato.</aside>","type":"year","sub":""},{"title":"Cristallomanzia","section":"Anno IV","html":"<div class=\"eyebrow\">Anno IV · Lezione 14 · Dispensa autorizzata</div><h2>Cristallomanzia</h2><p class=\"lead\">Una superficie limpida non garantisce una visione limpida.</p><p>La sfera riflette luce, ombre e movimenti dell’osservatore. La cristallomanzia richiede attenzione sostenuta, ma lo sforzo non deve diventare privazione di sonno o ostinazione.</p><p>Ciò che compare viene registrato prima di qualsiasi domanda interpretativa. Una figura indistinta è una figura indistinta, non un drago che certamente verrà.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Preparate luce costante e un tempo di prova limitato.</li><li>Osservate senza fissare compulsivamente un solo punto.</li><li>Riportate forma, durata e grado di nitidezza delle immagini.</li><li>Interrompete in caso di affaticamento; confrontate poi i registri.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Distinguete, nel vostro resoconto, riflesso esterno, immagine mentale e fenomeno non classificato.</p></div>","type":"chapter","sub":""},{"title":"Lo specchio annerito","section":"Anno IV","html":"<div class=\"eyebrow\">Anno IV · Lezione 15 · Dispensa autorizzata</div><h2>Lo specchio annerito</h2><p class=\"lead\">La suggestione ha una forma seducente.</p><p>L’uso dello specchio scuro è una variante dello scrying. Riducendo i particolari del riflesso, offre un campo nel quale la mente tende a costruire figure. La registrazione accurata permette di capire quanto abbiamo aggiunto noi.</p><p>Non è consentito tentare contatti con defunti, né usare un’esperienza di lutto altrui come materiale per l’esercitazione. La comunicazione con gli spiriti costituisce materia distinta e non si improvvisa.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Descrivete la stanza e le fonti luminose.</li><li>Osservate per un periodo breve stabilito dal docente.</li><li>Registrate ogni figura senza attribuirle identità.</li><li>Discutete ciò che potrebbe dipendere dalla luce o dalle aspettative.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Annotate tre modi in cui una figura neutra può acquisire un significato emotivo.</p></div>","type":"chapter","sub":""},{"title":"Oniromanzia: diario dei sogni","section":"Anno IV","html":"<div class=\"eyebrow\">Anno IV · Lezione 16 · Dispensa autorizzata</div><h2>Oniromanzia: diario dei sogni</h2><p class=\"lead\">I sogni si scrivono al risveglio, non dopo che sono accaduti i fatti.</p><p>I sogni possono intrecciare ricordi, timori, desideri e immagini prive di apparente origine. Soltanto un registro datato permette di non confondere il sogno ricordato con il sogno effettivamente annotato.</p><p>Non tutti i sogni sono premonitori. Cercare di trasformarli in presagi può peggiorare il riposo e alterare la memoria.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Al risveglio annotate luoghi, figure, colori, parole ed emozioni.</li><li>Segnate la differenza fra dettagli certi e ricordi vaghi.</li><li>Evitate letture immediate nei giorni di forte turbamento.</li><li>Rileggete dopo una settimana, senza modificare la prima versione.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Scrivete una pagina su un sogno inventato e proponete una lettura simbolica e una psicologica.</p></div><aside class=\"margin-note\">Dal quaderno di L.G. — Ho sognato un ponte molto tempo prima di capire che cosa avrei avuto paura di attraversare.</aside>","type":"chapter","sub":""},{"title":"Visione, memoria e testimonianza","section":"Anno IV","html":"<div class=\"eyebrow\">Anno IV · Lezione 17 · Dispensa autorizzata</div><h2>Visione, memoria e testimonianza</h2><p class=\"lead\">Un ricordo vivido non è per forza un ricordo completo.</p><p>La persona che riferisce una visione può essere sincera e imprecisa nello stesso tempo. Distinguiamo percezione immediata, ricostruzione successiva e significato attribuito. Il registro non cerca testimoni da convincere, ma dettagli da preservare.</p><p>Quando l’immagine riguarda la sicurezza di qualcuno, si parla con un adulto responsabile e si descrivono fatti concreti. Non si trasforma una possibilità in accusa contro un compagno.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Trascrivete la prima versione con data e ora.</li><li>In una seconda colonna annotate soltanto le interpretazioni successive.</li><li>Segnate ciò che non ricordate o che è cambiato.</li><li>Chiedete supporto se l’esperienza diventa difficile da gestire.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Confrontate due resoconti differenti dello stesso sogno: quali particolari sono stati aggiunti?</p></div>","type":"chapter","sub":""},{"title":"Anno V · Le mappe del cielo","section":"Anno V","html":"<div class=\"eyebrow\">Anno V · Sintesi intermedia</div><h2>Le mappe del cielo</h2><p class=\"large\">Le stelle indicano coordinate, non obblighi.</p><h3>Obiettivo formativo</h3><p>Leggere una mappa astrologica nella sua tradizione, distinguendo dati di osservazione e interpretazione.</p><div class=\"lesson-list\"><div><b>18 · Astrologia I</b><span>Carta del cielo e orientamento</span></div><div><b>19 · Astrologia II</b><span>Aspetti, case e letture concorrenti</span></div><div><b>20 · Luna e cicli</b><span>Osservazione e convenzioni astrologiche</span></div><div><b>21 · Preparazione ai G.U.F.O.</b><span>Prova scritta, prova pratica e revisione dei registri</span></div></div><aside class=\"margin-note\">La valutazione riguarda metodo, rigore e responsabilità. Nessun allievo è giudicato per l’assenza di un dono innato.</aside>","type":"year","sub":""},{"title":"Astrologia: costruire la carta","section":"Anno V","html":"<div class=\"eyebrow\">Anno V · Lezione 18 · Dispensa autorizzata</div><h2>Astrologia: costruire la carta</h2><p class=\"lead\">Prima di leggere un cielo bisogna sapere dove guardare.</p><p>Una carta astrologica colloca simbolicamente i corpi celesti in un momento e in un luogo. Per compilarla occorrono riferimenti temporali e spaziali accurati; un orario approssimativo va dichiarato come tale.</p><p>Costellazioni osservabili, segni zodiacali e case astrologiche appartengono a livelli diversi della descrizione. Confonderli rende il grafico elegante, ma il ragionamento debole.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Indicate data, ora, luogo e convenzione adottata.</li><li>Tracciate la struttura della carta e la legenda.</li><li>Distinguete coordinate astronomiche e ripartizioni astrologiche.</li><li>Proponete una lettura breve evidenziandone i limiti.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Completate una carta campione fornita dal docente e spiegate quali dati non si possono omettere.</p></div>","type":"chapter","sub":""},{"title":"Aspetti e configurazioni","section":"Anno V","html":"<div class=\"eyebrow\">Anno V · Lezione 19 · Dispensa autorizzata</div><h2>Aspetti e configurazioni</h2><p class=\"lead\">Una relazione geometrica non è una colpa morale.</p><p>Congiunzione, opposizione, trigono e quadratura vengono letti in base al sistema astrologico adottato. La figura indica una relazione simbolica, non una condanna caratteriale.</p><p>L’interpretazione si argomenta osservando l’insieme della carta; nessun singolo aspetto autorizza a definire il destino di una persona.</p><table><thead><tr><th>Aspetto</th><th>Domanda interpretativa</th></tr></thead><tbody><tr><td>Congiunzione</td><td>Quali elementi vengono associati?</td></tr><tr><td>Opposizione</td><td>Quale tensione o complementarità emerge?</td></tr><tr><td>Trigono</td><td>Quali possibilità appaiono più fluide?</td></tr><tr><td>Quadratura</td><td>Quale attrito o compito viene suggerito?</td></tr></tbody></table><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Scrivete due letture possibili della stessa opposizione, una prudente e una eccessiva: spiegate perché la seconda non è accettabile.</p></div>","type":"chapter","sub":""},{"title":"La Luna e il tempo osservato","section":"Anno V","html":"<div class=\"eyebrow\">Anno V · Lezione 20 · Dispensa autorizzata</div><h2>La Luna e il tempo osservato</h2><p class=\"lead\">Una fase si misura; un significato si interpreta.</p><p>La Luna muta aspetto in modo osservabile. Le tradizioni divinatorie le attribuiscono valori simbolici di inizio, crescita, culminazione e rilascio. Il dato astronomico e l’associazione simbolica non devono essere confusi.</p><p>Le notti nuvolose non sono un fallimento dell’osservatore. È possibile registrare l’assenza di visibilità e consultare una carta celeste autorizzata.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Registrate per sette sere la fase prevista e la visibilità reale.</li><li>Annotate le associazioni simboliche studiate in aula.</li><li>Indicate dove la vostra interpretazione aggiunge qualcosa al dato.</li><li>Confrontate i risultati con quelli di un compagno.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Descrivete la differenza tra «la Luna è crescente» e «questo periodo favorisce un inizio».</p></div><aside class=\"margin-note\">Un cielo coperto non significa che le stelle abbiano smesso di esistere.</aside>","type":"chapter","sub":""},{"title":"Preparazione ai G.U.F.O.","section":"Anno V","html":"<div class=\"eyebrow\">Anno V · Lezione 21 · Dispensa autorizzata</div><h2>Preparazione ai G.U.F.O.</h2><p class=\"lead\">La chiarezza è una prova di maturità.</p><p>La verifica del quinto anno prende in considerazione padronanza del lessico, metodo di osservazione, capacità interpretativa e limiti dichiarati. Non premia la previsione sensazionale.</p><p>La prova pratica può richiedere la lettura di una tazza o la descrizione di una sfera; la prova scritta richiede di argomentare le conclusioni e riconoscere le alternative.</p><table><thead><tr><th>Parte</th><th>Criterio</th></tr></thead><tbody><tr><td>Osservazione</td><td>Segni trascritti senza invenzioni</td></tr><tr><td>Interpretazione</td><td>Collegamenti comprensibili e motivati</td></tr><tr><td>Alternative</td><td>Almeno una lettura concorrente</td></tr><tr><td>Responsabilità</td><td>Linguaggio non coercitivo</td></tr></tbody></table><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Rivedete tre esercizi precedenti e cerchiate una correzione che avreste voluto nascondere: spiegate che cosa avete imparato.</p></div>","type":"chapter","sub":""},{"title":"Anno VI · Scelte e possibilità","section":"Anno VI","html":"<div class=\"eyebrow\">Anno VI · Interpretazione avanzata</div><h2>Scelte e possibilità</h2><p class=\"large\">Una domanda sul futuro cambia quando cambia chi la pronuncia.</p><h3>Obiettivo formativo</h3><p>Confrontare metodi diversi e riconoscere il rischio di influenzare una scelta attraverso una lettura.</p><div class=\"lesson-list\"><div><b>22 · Sistemi comparati</b><span>Il Libro dei Mutamenti e la logica della trasformazione</span></div><div><b>23 · Percorsi e biforcazioni</b><span>Scenari, condizioni, conseguenze</span></div><div><b>24 · Le emozioni del consultante</b><span>Neutralità, ascolto, distanza</span></div><div><b>25 · Anomalie e visioni spontanee</b><span>Documento, discrezione e segnalazione</span></div></div><aside class=\"margin-note\">La valutazione riguarda metodo, rigore e responsabilità. Nessun allievo è giudicato per l’assenza di un dono innato.</aside>","type":"year","sub":""},{"title":"Il Libro dei Mutamenti","section":"Anno VI","html":"<div class=\"eyebrow\">Anno VI · Lezione 22 · Dispensa autorizzata</div><h2>Il Libro dei Mutamenti</h2><p class=\"lead\">Studiare una tradizione non significa appropriarsene senza conoscerla.</p><p>Il <em>Libro dei Mutamenti</em>, noto come <em>Yijing</em>, organizza immagini della trasformazione attraverso esagrammi di linee intere o spezzate. Nel nostro corso costituisce una lettura comparata, non una sostituzione delle pratiche britanniche.</p><p>Studieremo il rapporto fra situazione presente e mutamento possibile, rispettando il fatto che il testo proviene da un contesto culturale preciso e stratificato.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Distinguete linea intera, linea spezzata e loro combinazioni.</li><li>Descrivete la figura ottenuta senza dichiararla un verdetto.</li><li>Consultate la traduzione indicata dal docente.</li><li>Confrontate una lettura rigida e una che valorizzi il cambiamento.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Indicate quale perdita si produce quando un intero sistema filosofico viene ridotto a «sì» o «no».</p></div>","type":"chapter","sub":""},{"title":"I futuri possibili","section":"Anno VI","html":"<div class=\"eyebrow\">Anno VI · Lezione 23 · Dispensa autorizzata</div><h2>I futuri possibili</h2><p class=\"lead\">Il condizionale non è una forma di vigliaccheria.</p><p>Si può descrivere un futuro come un percorso di condizioni: se una persona compie una scelta, alcune conseguenze diventano più plausibili; altre restano aperte. Questo non dimostra che ogni visione possa essere mutata.</p><p>L’esercizio è ragionare senza fingere di conoscere la totalità delle cause. Le profezie autentiche, quando si verificano, richiedono una prudenza ancora maggiore.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Partite da una situazione concreta ma non privata.</li><li>Disegnate due azioni possibili e due risultati per ciascuna.</li><li>Indicate ciò che non sapete sulle conseguenze.</li><li>Formulate una domanda migliore da porre nel presente.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Trasformate «fallirai l’esame» in un insieme di possibilità accompagnate da azioni realistiche.</p></div>","type":"chapter","sub":""},{"title":"Ascoltare senza dirigere","section":"Anno VI","html":"<div class=\"eyebrow\">Anno VI · Lezione 24 · Dispensa autorizzata</div><h2>Ascoltare senza dirigere</h2><p class=\"lead\">La voce del divinatore può modificare la domanda.</p><p>La persona che consulta attribuisce spesso grande autorità al lettore. Una frase avventata può indurre paura, dipendenza o decisioni non ponderate. Il valore di un consulto è anche nella possibilità di dire «non so».</p><p>In laboratorio non leggiamo situazioni intime vere senza consenso esplicito e supervisione: usiamo casi inventati.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Chiarite che cosa il consultante desidera comprendere.</li><li>Proponete una lettura priva di ordini.</li><li>Invitate a valutare alternative e informazioni non magiche.</li><li>Interrompete se l’interlocutore si sente sopraffatto.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Scrivete un dialogo di dodici battute in cui il lettore restituisce autonomia a un consultante impaurito.</p></div>","type":"chapter","sub":""},{"title":"Il registro delle visioni involontarie","section":"Anno VI","html":"<div class=\"eyebrow\">Anno VI · Lezione 25 · Dispensa autorizzata</div><h2>Il registro delle visioni involontarie</h2><p class=\"lead\">Certe immagini arrivano prima delle domande.</p><p>Una visione spontanea, un frammento udito senza fonte o un sogno di intensa nitidezza non vanno trattati come un normale compito di lettura. Si registra l’esperienza senza cercare deliberatamente di riprodurla.</p><p>In caso di contenuti angoscianti, l’allievo si rivolge al docente o a un adulto di fiducia. Non si disseminano voci, non si interrogano compagni alla ricerca di «conferme» e non si assume su di sé la responsabilità di ogni esito.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Annotate immediatamente la percezione in forma descrittiva.</li><li>Separate simboli, persone riconoscibili e sensazioni.</li><li>Segnalate privatamente eventuali preoccupazioni concrete.</li><li>Lasciate la valutazione a un adulto competente.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Compilate un modulo su una visione immaginaria rispettando i confini di riservatezza.</p></div><aside class=\"margin-note\">Nota a margine — Avevo nove anni quando imparai quanto può costare non essere creduti. Questo non rende ogni visione vera.</aside>","type":"chapter","sub":""},{"title":"Anno VII · Il dovere di non sapere tutto","section":"Anno VII","html":"<div class=\"eyebrow\">Anno VII · Studio conclusivo</div><h2>Il dovere di non sapere tutto</h2><p class=\"large\">La maestria è disciplina, non dominio del futuro.</p><h3>Obiettivo formativo</h3><p>Formulare, presentare e difendere una lettura completa; riconoscere quando non bisogna pronunciarla.</p><div class=\"lesson-list\"><div><b>26 · Cronomanzia critica</b><span>Sequenze, ricorrenze e falsa precisione</span></div><div><b>27 · Profezie e archivi</b><span>Responsabilità della trasmissione</span></div><div><b>28 · Oggetti-ancora</b><span>Costruzione e limiti di un manufatto</span></div><div><b>29 · Consultazione completa</b><span>Dati, lettura, obiezioni e custodia</span></div><div><b>30 · Prova finale</b><span>Giudizio motivato e professionalità</span></div></div><aside class=\"margin-note\">La valutazione riguarda metodo, rigore e responsabilità. Nessun allievo è giudicato per l’assenza di un dono innato.</aside>","type":"year","sub":""},{"title":"Cronomanzia: la misura incerta","section":"Anno VII","html":"<div class=\"eyebrow\">Anno VII · Lezione 26 · Dispensa autorizzata</div><h2>Cronomanzia: la misura incerta</h2><p class=\"lead\">Il tempo non è una strada già illuminata.</p><p>La cronomanzia, in questo programma, studia ricorrenze, sequenze e ipotesi temporali nella lettura dei segni. Le date esatte richiedono prove molto più forti di una somiglianza simbolica.</p><p>Evitate di convertire tre eventi simili in una legge. E non confondete il lavoro divinatorio con gli incantesimi che agiscono materialmente sul tempo: si tratta di ambiti distinti e regolati diversamente.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Descrivete una sequenza di cinque eventi e il criterio che li raggruppa.</li><li>Formulate due ipotesi sulla ricorrenza.</li><li>Indicate che cosa le smentirebbe.</li><li>Spiegate perché non si può garantire una data sulla base della sola serie.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Scrivete una critica a un oracolo che promette «l’evento accadrà martedì alle 17».</p></div>","type":"chapter","sub":""},{"title":"Profezia, custodia e discrezione","section":"Anno VII","html":"<div class=\"eyebrow\">Anno VII · Lezione 27 · Dispensa autorizzata</div><h2>Profezia, custodia e discrezione</h2><p class=\"lead\">Ciò che si sa non appartiene automaticamente a chi lo ha udito.</p><p>Nel mondo magico alcune profezie sono conservate e consultate sotto severe cautele. Il fatto che esistano archivi non autorizza allievi o docenti a cercare informazioni riservate: questa lezione riguarda il principio di custodia, non le procedure per accedervi.</p><p>Una rivelazione può influenzare le decisioni di chi l’ascolta. Per questo la trasmissione è già un atto morale, prima ancora di essere una prova di accuratezza.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Separate il contenuto di un presagio da chi ne avrebbe diritto a conoscenza.</li><li>Valutate rischi della divulgazione e del silenzio.</li><li>Descrivete la procedura di segnalazione scolastica per un rischio concreto.</li><li>Motivate la scelta senza ricorrere alla curiosità personale.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Un allievo riferisce una visione su un compagno: costruite una risposta rispettosa della privacy e della sicurezza.</p></div>","type":"chapter","sub":""},{"title":"Costruire un oggetto-ancora","section":"Anno VII","html":"<div class=\"eyebrow\">Anno VII · Lezione 28 · Dispensa autorizzata</div><h2>Costruire un oggetto-ancora</h2><p class=\"lead\">Un oggetto aiuta a tornare nel presente; non cancella il passato.</p><p>Il manufatto finale può essere una bussola simbolica, un mazzo annotato, un pendolo calibrato o un piccolo oggetto di concentrazione. Va progettato per un uso ripetibile e accompagnato da istruzioni e avvertenze.</p><p>Un oggetto personale non riceve automaticamente poteri perché per noi è importante. L’efficacia pratica del manufatto va descritta con onestà.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Disegnate il manufatto, indicando materiali e funzione.</li><li>Scrivete procedura, durata e limiti d’uso.</li><li>Prevedete un controllo degli errori e un registro.</li><li>Presentate una dimostrazione con conclusioni prudenti.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Consegnate una scheda di progetto di una pagina e un esempio di prova documentata.</p></div><aside class=\"margin-note\">Sul vetro del mio ciondolo il tempo ha lasciato una crepa quasi invisibile. Non l’ho mai fatta riparare.</aside>","type":"chapter","sub":""},{"title":"La consultazione completa","section":"Anno VII","html":"<div class=\"eyebrow\">Anno VII · Lezione 29 · Dispensa autorizzata</div><h2>La consultazione completa</h2><p class=\"lead\">L’ultima parola appartiene a chi deve vivere la propria vita.</p><p>Una consultazione completa non usa necessariamente più strumenti: ne usa quanti servono. Moltiplicare carte, sfere e mappe per ottenere una risposta desiderata è un errore tanto quanto ignorare i risultati discordanti.</p><p>Ogni relazione finale deve poter essere letta da chi non ha assistito alla pratica: domanda, metodo, osservazioni, interpretazione, alternative, limiti ed eventuali raccomandazioni non coercitive.</p><h3>Procedura di studio</h3><ol class=\"study-steps\"><li>Definite una domanda ammissibile e il consenso.</li><li>Scegliete il metodo spiegandone il motivo.</li><li>Registrate dati e interpretazioni in sezioni separate.</li><li>Presentate almeno una lettura concorrente e concludete senza pretese assolute.</li></ol><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Redigete una consultazione di prova su un caso inventato, massimo due pagine.</p></div>","type":"chapter","sub":""},{"title":"La prova conclusiva","section":"Anno VII","html":"<div class=\"eyebrow\">Anno VII · Lezione 30 · Dispensa autorizzata</div><h2>La prova conclusiva</h2><p class=\"lead\">Una risposta impeccabile può essere: non possiedo dati sufficienti.</p><p>La prova conclusiva propone un caso narrativo, una tazza, tre carte e un estratto di carta celeste. L’allievo non deve forzare le fonti a parlare all’unisono. Può e deve segnalare contraddizioni.</p><p>Il giudizio considera la qualità del registro, l’uso appropriato dei metodi, la capacità di discutere i limiti e il rispetto per il consultante. Nessuno viene premiato per aver annunciato una tragedia.</p><table><thead><tr><th>Voce</th><th>Peso</th></tr></thead><tbody><tr><td>Documentazione</td><td>25%</td></tr><tr><td>Padronanza del metodo</td><td>25%</td></tr><tr><td>Interpretazione e alternative</td><td>25%</td></tr><tr><td>Responsabilità e comunicazione</td><td>25%</td></tr></tbody></table><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Preparate una pagina di autovalutazione: un punto forte, un errore, una regola che porterete fuori dall’aula.</p></div><div class=\"star-quote\">«Il maestro non è colui che vede tutto. È colui che sa quando guardare altrove.»</div>","type":"chapter","sub":""},{"title":"Atlante essenziale dei segni","section":"Strumenti","html":"<div class=\"eyebrow\">Repertorio · uso scolastico</div><h2>Atlante essenziale dei segni</h2><p>I significati che seguono sono suggerimenti contestuali, non traduzioni obbligatorie. Prima della lettura annotate il sistema di riferimento che state utilizzando.</p><table><thead><tr><th>Figura</th><th>Campi possibili</th></tr></thead><tbody><tr><td>Stella</td><td>orientamento, distanza, desiderio</td></tr><tr><td>Ponte</td><td>passaggio, rischio, connessione</td></tr><tr><td>Chiave</td><td>accesso, scelta, segreto</td></tr><tr><td>Corvo</td><td>attenzione, memoria, mutamento</td></tr><tr><td>Porta</td><td>soglia, esclusione, occasione</td></tr><tr><td>Acqua</td><td>riflesso, instabilità, profondità</td></tr><tr><td>Orologio</td><td>attesa, ordine, pressione</td></tr><tr><td>Filo</td><td>legame, fragilità, continuità</td></tr></tbody></table><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Scegliete due simboli e costruite una lettura che non implichi alcuna minaccia.</p></div>","type":"chapter","sub":""},{"title":"Tre casi da discutere","section":"Strumenti","html":"<div class=\"eyebrow\">Laboratorio · studio guidato</div><h2>Tre casi da discutere</h2><p><strong>Caso A — La finestra.</strong> Una finestra socchiusa appare in una tazza. Un lettore pensa a una possibilità; un altro a un’indiscrezione. Che cosa dovrebbe essere chiesto prima di scegliere?</p><p><strong>Caso B — La strada.</strong> Uno studente sogna un ponte e la mattina apprende che la pioggia ha chiuso un passaggio. Come evitare di trasformare una somiglianza generica in previsione certa?</p><p><strong>Caso C — La costellazione.</strong> Due studenti usano la stessa carta astrologica e producono conclusioni opposte. Confrontate convenzioni, passaggi e dati omessi.</p><div class=\"exercise\"><b>✧ Esercizio per il quaderno</b><p>Per ciascun caso scrivete osservazione, due letture, un limite e una domanda utile al consultante.</p></div>","type":"chapter","sub":""},{"title":"Modello: il registro","section":"Strumenti","html":"<div class=\"eyebrow\">Pagina da ricopiare</div><h2>Modello: il registro</h2><p>Non presentate un registro ripulito dagli errori. Ogni correzione va datata; la trasparenza è parte del metodo.</p><table><thead><tr><th>Voce</th><th>Annotazione</th></tr></thead><tbody><tr><td>Data, ora, luogo</td><td>____________________________</td></tr><tr><td>Domanda e consenso</td><td>____________________________</td></tr><tr><td>Strumento e condizioni</td><td>____________________________</td></tr><tr><td>Osservazione senza aggettivi</td><td>____________________________</td></tr><tr><td>Ipotesi iniziale</td><td>____________________________</td></tr><tr><td>Lettura alternativa</td><td>____________________________</td></tr><tr><td>Possibile verifica</td><td>____________________________</td></tr><tr><td>Esito e revisioni</td><td>____________________________</td></tr></tbody></table><aside class=\"margin-note\">In caso di visioni personali, potete chiedere che il registro resti privato e non sia usato come esercizio di classe.</aside>","type":"chapter","sub":""},{"title":"Piccolo glossario","section":"Strumenti","html":"<div class=\"eyebrow\">Lessico tecnico</div><h2>Piccolo glossario</h2><p><strong>Auguria:</strong> tradizione interpretativa basata sul comportamento e sulla presenza degli uccelli. <strong>Cartomanzia:</strong> lettura simbolica delle carte secondo convenzioni dichiarate.</p><p><strong>Ceromanzia:</strong> interpretazione delle forme assunte dalla cera. <strong>Cristallomanzia:</strong> osservazione divinatoria di superfici cristalline. <strong>Litomanzia:</strong> lettura di pietre o oggetti scelti per un sistema simbolico.</p><p><strong>Oniromanzia:</strong> interpretazione di sogni annotati. <strong>Scrying:</strong> osservazione di superfici riflettenti o scure per indagare immagini percepite. <strong>Tasseomanzia:</strong> lettura delle figure lasciate da foglie di tè.</p><p><strong>Presagio:</strong> evento letto come possibile segno. <strong>Profezia:</strong> comunicazione divinatoria di natura eccezionale, non assimilabile a ogni semplice interpretazione. <strong>Registro:</strong> documento che conserva anche errori e incertezze.</p>","type":"chapter","sub":""},{"title":"Criteri di valutazione","section":"Strumenti","html":"<div class=\"eyebrow\">Per ciascun anno · trasparenza</div><h2>Criteri di valutazione</h2><p>La Divinazione scolastica è valutata come pratica di osservazione, interpretazione, argomentazione e responsabilità. Non si possono misurare in modo equo le predisposizioni innate; per questo non sono un criterio di merito.</p><p>Primo e secondo anno: linguaggio dell’osservazione e correttezza del registro. Terzo e quarto anno: repertori e metodi, capacità di distinguere immagine e suggestione. Quinto anno: sintesi e preparazione ai G.U.F.O. Sesto e settimo anno: consultazione responsabile, custodia e qualità del giudizio.</p><table><thead><tr><th>Livello</th><th>Evidenza richiesta</th></tr></thead><tbody><tr><td>Iniziale</td><td>Descrive il segno ma confonde interpretazione e dato</td></tr><tr><td>Adeguato</td><td>Documenta il metodo e riconosce almeno un’alternativa</td></tr><tr><td>Solido</td><td>Argomenta e corregge errori senza nasconderli</td></tr><tr><td>Eccellente</td><td>Mostra rigore, discrezione e giudizio autonomo</td></tr></tbody></table>","type":"chapter","sub":""},{"title":"Ai miei studenti","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">Ringraziamenti · non materia d’esame</div><h2>Ai miei studenti</h2><p>Grazie a chi ha fatto una domanda quando la classe taceva. A chi ha ammesso di non vedere niente nella sfera e ha avuto il coraggio di scriverlo. A chi ha saputo custodire il timore di un compagno senza trasformarlo in un racconto da far circolare.</p><p>Ho conosciuto persone che volevano soltanto una risposta, e altre che avevano soprattutto bisogno di essere ascoltate. Spero che queste pagine vi insegnino la differenza. Non vi auguro di diventare infallibili. Vi auguro di restare umani quando sarebbe più semplice recitare la parte dell’oracolo.</p><p>Forse in aula non ve lo dirò con questa chiarezza. Ma sono orgoglioso di voi quando preferite la cura alla certezza, e quando sapete richiudere un libro per andare ad aiutare qualcuno.</p><p>Avete reso la torre un luogo meno silenzioso. Non pensavo che ne sarei stato grato.</p><div class=\"star-quote\">«Non dovete vedere il futuro per meritare un futuro.»</div><p class=\"muted\">Con sincero affetto, Lysander Goldtry</p>","type":"chapter","sub":""},{"title":"Le note lasciate a margine","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">Appunti ritrovati nella copia dell’autore</div><h2>Le note lasciate a margine</h2><p><strong>Accanto alla lezione sul pendolo:</strong> «Non chiedere allo strumento ciò che hai paura di domandare a una persona.»</p><p><strong>Accanto al capitolo sui sogni:</strong> «Talvolta mi sveglio prima dell’urto. Il corpo ricorda il resto.»</p><p><strong>Accanto all’atlante delle stelle:</strong> «Ci sono notti in cui il cielo è l’unica cosa a non volere niente da me.»</p><p><strong>Accanto alla lezione sugli errori:</strong> «Non è più possibile tornare a quella mattina. Non smetto di provarci, almeno nei sogni.»</p><p><strong>Accanto alla parola futuro:</strong> «Non pronunciarla come se possedessi quello di qualcun altro.»</p><aside class=\"margin-note\">Questi appunti furono trascritti dall’autore stesso. Il loro inserimento nell’edizione destinata agli studenti è intenzionale, anche se non ne spiega il motivo.</aside>","type":"chapter","sub":""},{"title":"Nota personale: Londra senza stelle","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">Dal taccuino del professore</div><h2>Nota personale: Londra senza stelle</h2><p>Dopo Hogwarts lavoravo a Londra. Leggevo carte in una piccola stanza e ascoltavo persone che desideravano sapere se qualcuno sarebbe tornato, se una porta si sarebbe aperta, se l’assenza aveva un significato. Non potevo rispondere a tutto; e per molto tempo ho scambiato quel limite per una colpa.</p><p>La città aveva lampioni, vetrine, finestre accese. Eppure di notte mi mancava proprio la luce: quella lontanissima, silenziosa, che non chiede denaro per mostrarsi. Tornavo a casa con le domande degli altri nel cappotto e nessun posto dove deporle.</p><p>Quando mi offrirono di insegnare a Hogwarts, non immaginai una vocazione luminosa. Pensai a un luogo dove poter respirare e a ragazzi cui avrei potuto dire, prima che fosse troppo tardi, che vedere non equivale a dover salvare tutti.</p><div class=\"star-quote\">«Le stelle non mi hanno mai promesso una risposta. Per questo sono riuscito a fidarmi di loro.»</div>","type":"chapter","sub":""},{"title":"Il ciondolo di vetro","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">Annotazione non destinata alla lezione</div><h2>Il ciondolo di vetro</h2><p>Lo porto sotto la camicia, appoggiato dove posso sentirne il peso. È un vetro fatto incastonare attorno a frammenti di meteorite e polvere di pietraluna. Non è un talismano capace di cancellare una visione e non lo è mai stato.</p><p>Quando le immagini diventano troppo insistenti, lo tengo fra due dita e conto i bordi della montatura. Il metallo si scalda. Io ricordo di essere qui, nella stanza, in questo giorno. Talvolta basta. Talvolta no.</p><p>Lo acquistai dopo aver capito che non potevo vivere tutta la vita nella notte in cui ero rimasto fermo. La crepa del vetro mi accompagna da anni. La conosco così bene che, a occhi chiusi, saprei disegnarla.</p><aside class=\"margin-note\">A questa pagina è rimasta impressa una piccola macchia argentata. Non sembra inchiostro.</aside>","type":"chapter","sub":""},{"title":"Tema di un bambino · facciata I","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">Foglio scolastico conservato · Lysander, otto anni</div><h2>Tema di un bambino · facciata I</h2><p><strong>Consegna:</strong> «Descrivi che cosa vorresti fare quando sarai grande.»</p><p><span class=\"childhand\">Quando sarò grande voglio fare un lavoro che serve. Non so quale. Forse uno che trova le cose perse, perché quando perdi una cosa tutti ti dicono di cercare meglio, ma a volte tu hai già cercato tanto.</span></p><p><span class=\"childhand\">Il mio amico Elliot dice che diventeremo esploratori. Lui porterà la mappa e io gli dirò dove andare. Io però certe volte sogno dei posti prima di vederli e lui dice che è una cosa bellissima. A me non piace sempre, perché non so spiegare come faccio.</span></p><p><span class=\"childhand\">Quando sarò grande vorrei sapere come si fa a dire a una persona una cosa brutta senza farla spaventare. E vorrei che gli adulti ascoltassero anche i bambini quando parlano sul serio.</span></p><aside class=\"margin-note\">La maestra sottolineò: «Bella immaginazione. Cerca di restare più vicino alla traccia.»</aside>","type":"chapter","sub":""},{"title":"Tema di un bambino · facciata II","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">Continuazione · carta ingiallita</div><h2>Tema di un bambino · facciata II</h2><p><span class=\"childhand\">La cosa che preferisco è guardare il cielo quando è buio. Non capisco perché tutte le stelle stanno così lontane. Se una di loro cade, qualcuno se ne accorge? Elliot dice che le stelle non cadono, che quelle sono cose diverse. Però se vedo una luce scendere penso sempre che qualcuno la stia salutando.</span></p><p><span class=\"childhand\">Da grande voglio avere una finestra grande e un posto per Elliot vicino alla finestra, così possiamo parlare senza che nessuno ci dica di andare a dormire.</span></p><p><span class=\"childhand\">Vorrei anche essere coraggioso. Non quello che non ha paura, ma quello che parla lo stesso. Perché qualche volta faccio fatica a parlare e poi mi arrabbio con me.</span></p><p><span class=\"childhand\">Questo è tutto. Non so se vale come tema.</span></p><div class=\"star-quote\">Nel margine inferiore, in grafia adulta: «Valeva. Avrei voluto dirtelo allora.» — L. G.</div>","type":"chapter","sub":""},{"title":"La notte che non posso correggere","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">Confessione · custodire con discrezione</div><h2>La notte che non posso correggere</h2><p>Avevo nove anni quando vidi un incidente in sogno. Riconobbi la strada, un rumore, un dettaglio impossibile da dimenticare. Vidi che il mio migliore amico non sarebbe tornato a casa. Lo dissi a mia madre, a chi poteva ascoltarmi, persino a chi avrebbe dovuto occuparsi della sicurezza di quella strada. Ero un bambino: le parole sembrarono fantasia o paura.</p><p>Quando accadde, il mondo non ebbe il pudore di cambiare colore. Continuò. Le persone parlarono, qualcuno mi prese per mano, qualcuno disse che non c’era niente che avrei potuto fare. Io continuai a chiedermi se un gesto diverso avrebbe aperto un’altra strada.</p><p>La ragione oggi sa che avevo nove anni. Una parte di me è rimasta là, con la convinzione assurda che conoscere qualcosa significhi poterla impedire. Ho insegnato molte lezioni su questa distinzione. Non ho ancora imparato a sentirla vera per me.</p><div class=\"star-quote\">«Non tutto ciò che non avete potuto salvare vi appartiene.»</div>","type":"chapter","sub":""},{"title":"Un biglietto mai consegnato","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">Per Elliot · senza data</div><h2>Un biglietto mai consegnato</h2><p>Elliot, oggi uno studente ha disegnato un ponte su un foglio e mi ha chiesto perché lo stesso segno possa indicare incontro e separazione. Ho risposto con parole ragionevoli. Non ho detto che per qualche istante ero tornato a quella strada.</p><p>Vorrei raccontarti la torre, il rumore delle sedie, le tazze lasciate a raffreddare, il ragazzo che non teme di farmi una domanda scomoda. Vorrei che ridessi del mio modo troppo serio di spiegare cose che nessuno può promettere.</p><p>Da piccolo avevo scritto che ti avrei tenuto un posto vicino alla finestra. A volte, quando preparo le lezioni e guardo le stelle, lascio la sedia accanto alla mia scrivania un poco discosta dal tavolo. È ridicolo. Non riesco a smettere.</p><p class=\"muted\">Il resto del foglio è bianco.</p>","type":"chapter","sub":""},{"title":"Il giorno che avrei cambiato","section":"Pagine sigillate","html":"<div class=\"sealed-page\" data-seal=\"0\"><div class=\"seal-rune\" aria-hidden=\"true\">✧</div><div class=\"eyebrow\">Pagina protetta · incanto di occultamento</div><h2>Il giorno che avrei cambiato</h2><p>Il testo rimane invisibile finché non viene pronunciata la parola corretta. Questa pagina non fa parte del programma.</p><div class=\"seal-caption\">Indizio inciso sul bordo</div><p class=\"seal-hint\">Ciò che accende una bacchetta nel buio.</p><form class=\"unlock-form\" data-unlock=\"0\"><label for=\"seal-input-0\">Pronuncia l'incanto</label><div class=\"unlock-row\"><input id=\"seal-input-0\" name=\"phrase\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Parola d’accesso\" required><button type=\"submit\">✦ Revelio</button></div><p class=\"unlock-feedback\" role=\"status\" aria-live=\"polite\"></p></form><p class=\"muted\">Le pagine sono cifrate; non basta sfogliare il codice del libro per leggerle. Chi conosce la parola può comunque rivelarle: non usarle per custodire veri segreti personali.</p></div>","type":"sealed","sub":""},{"title":"La stanza senza testimoni","section":"Pagine sigillate","html":"<div class=\"sealed-page\" data-seal=\"1\"><div class=\"seal-rune\" aria-hidden=\"true\">✧</div><div class=\"eyebrow\">Pagina protetta · incanto di occultamento</div><h2>La stanza senza testimoni</h2><p>Il testo rimane invisibile finché non viene pronunciata la parola corretta. Questa pagina non fa parte del programma.</p><div class=\"seal-caption\">Indizio inciso sul bordo</div><p class=\"seal-hint\">La parola che spegne la luce, ma non ciò che ricordiamo.</p><form class=\"unlock-form\" data-unlock=\"1\"><label for=\"seal-input-1\">Pronuncia l'incanto</label><div class=\"unlock-row\"><input id=\"seal-input-1\" name=\"phrase\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Parola d’accesso\" required><button type=\"submit\">✦ Revelio</button></div><p class=\"unlock-feedback\" role=\"status\" aria-live=\"polite\"></p></form><p class=\"muted\">Le pagine sono cifrate; non basta sfogliare il codice del libro per leggerle. Chi conosce la parola può comunque rivelarle: non usarle per custodire veri segreti personali.</p></div>","type":"sealed","sub":""},{"title":"Ultima nota dell’autore","section":"Dopo le lezioni","html":"<div class=\"eyebrow\">A chi ha letto oltre il necessario</div><h2>Ultima nota dell’autore</h2><p>Le pagine precedenti non sono un esame. Non chiedo a nessuno di comprenderle, e tanto meno di consolarmi. Sono rimaste qui perché un giorno mi sono domandato che cosa sarebbe successo se avessi smesso di fingere che un professore debba conoscere tutte le risposte.</p><p>Se avete custodito quello che avete letto, vi ringrazio. Se avete scelto di richiudere il libro prima dei segreti, avete fatto altrettanto bene. La curiosità non è sempre una ragione sufficiente per aprire una porta.</p><p>Domani ricominceremo dalle cose semplici: una tazza, una penna, un quaderno. Il cielo sarà lo stesso. Noi potremo essere un poco diversi.</p><div class=\"star-quote\">«Non ho mai chiesto alle stelle di salvarmi. Avevo soltanto bisogno di un luogo in cui non fosse necessario salvare nessuno.»</div><p class=\"muted\">Lysander Goldtry · Hogwarts</p>","type":"chapter","sub":""},{"title":"Copertina posteriore","section":"Chiusura","html":"<div class='back-cover'><div class='back-symbol'>✧</div><p>Non tutte le visioni indicano una strada.<br>Non tutte le stelle sono una promessa.<br>Non tutto ciò che non puoi salvare<br>è colpa tua.</p><div class='cover-rule'></div><small>FINE DEL QUADERNO<br>INIZIO DELLA NOTTE SUCCESSIVA</small></div>","type":"back","sub":""}];

 const delay=audioCtx.createDelay(1.5);delay.delayTime.value=.49;const dg=audioCtx.createGain();dg.gain.value=.26;const fb=audioCtx.createGain();fb.gain.value=.22;delay.connect(dg);dg.connect(master);delay.connect(fb);fb.connect(delay);wet=delay;
}
function tone(hz,t,length,volume,type='sine'){if(!audioCtx||!master)return;const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.00001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),t+.085);g.gain.exponentialRampToValueAtTime(.00001,t+length);osc.connect(g);g.connect(master);g.connect(wet);osc.start(t);osc.stop(t+length+.05);}
function scheduleMusic(){if(!audioCtx||!musicOn)return;const horizon=audioCtx.currentTime+1.5;while(scheduledUntil<horizon){const n=musicStep;const t=scheduledUntil;
 // slow three-note shimmer (6/8), with descending minor-mode phrase
 const base=bass[Math.floor(n/12)%4];if(n%12===0){tone(base/2,t,7.8,.08,'sine');tone(base*1.5,t+.22,6.8,.025,'triangle');}
 let degree=melody[n%melody.length];let scale=[0,2,3,5,7,8,10,12,14,15,17,19,20];let k=degree<0?-1:degree%scale.length;const semis=degree<0?-2:scale[k]+Math.floor(degree/scale.length)*12;
 let freq=293.66*Math.pow(2,semis/12);if(n%2===0)tone(freq,t+.08,2.4,.045,'sine');if(n%6===0)tone(freq/2,t+.22,4.1,.029,'triangle');
 scheduledUntil+=.72;musicStep++;}}
$('music').addEventListener('click',async(e)=>{try{startAudio();await audioCtx.resume();musicOn=!musicOn;if(musicOn){scheduledUntil=audioCtx.currentTime+.05;musicStep=0;scheduleMusic();musicTimer=setInterval(scheduleMusic,360);}else{clearInterval(musicTimer);musicTimer=null;await audioCtx.suspend();}e.currentTarget.textContent='♫ Musica: '+(musicOn?'on':'off');e.currentTarget.setAttribute('aria-pressed',String(musicOn));}catch(err){e.currentTarget.textContent='♫ Musica non disponibile';}});
function playFlip(){if(!flipOn||!audioCtx||audioCtx.state!=='running')return;const t=audioCtx.currentTime;const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='triangle';osc.frequency.setValueAtTime(195,t);osc.frequency.exponentialRampToValueAtTime(110,t+.13);g.gain.setValueAtTime(.00001,t);g.gain.linearRampToValueAtTime(.012,t+.025);g.gain.exponentialRampToValueAtTime(.00001,t+.16);osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+.17);}

render();
